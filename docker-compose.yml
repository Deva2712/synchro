# PostgreSQL + pgvector for the production storage path.
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg://sentinel:sentinel@localhost:5432/sentinel
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes:
      - sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      retries: 10

volumes:
  sentinel-db:
